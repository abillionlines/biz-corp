services:
  - type: web
    name: bizcorp-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "app:create_app()"
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false # Set this manually in Render dashboard to your Neon connection string
      - key: ALLOWED_ORIGINS
        sync: false # Set this manually in Render dashboard to your Vercel URL
      - key: GROQ_API_KEY
        sync: false # Set this manually in Render dashboard
